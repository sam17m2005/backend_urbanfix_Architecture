# OpenTelemetry Collector para UrbanFix (prueba de concepto, Modulo 7).
# Solo usa componentes del nucleo del Collector: otlp (receptor), memory_limiter y batch (procesadores) y debug (exportador).
# La app exporta por OTLP/HTTP (puerto 4318) para no compilar grpcio en la imagen Alpine del proyecto.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:        # evita que el Collector crezca sin limite en una maquina con poca RAM
    check_interval: 1s
    limit_mib: 150
    spike_limit_mib: 30
  batch:
    timeout: 5s

exporters:
  debug:                 # imprime lo recibido en la salida del Collector: `docker logs urbanfix-otel-collector`
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
