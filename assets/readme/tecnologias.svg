<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
<foreignObject x="0" y="0" width="900" height="300">
<div xmlns="http://www.w3.org/1999/xhtml" class="r">
<style>
*{box-sizing:border-box;margin:0;padding:0}
.r{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;color:#1f2a36;font-size:15px;line-height:1.55;width:100%;height:100%}
b{font-weight:700}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;background:#e3e7e4;border-radius:4px;padding:1px 5px}
.oscuro code{background:#4a5158;color:#f4f5f3}

.h{font-weight:800;font-size:28px;margin:0 0 14px 2px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#d5d9d6;border:1px solid #d5d9d6;border-radius:14px;overflow:hidden}
.c{background:#fff;padding:16px 18px;min-height:96px}
.c:nth-child(-n+4){border-top:4px solid #f5c518}
.k{font-size:12.5px;color:#5b6773;margin-bottom:5px}
.v{font-weight:700;font-size:15px;line-height:1.35}
</style>
<div class="h">Tecnologías</div><div class="g"><div class="c"><div class="k">Lenguaje</div><div class="v">Python 3.10+</div></div><div class="c"><div class="k">Framework</div><div class="v">Flask (con Blueprints)</div></div><div class="c"><div class="k">Base de Datos</div><div class="v">PostgreSQL (gestionada en Neon)</div></div><div class="c"><div class="k">ORM</div><div class="v">SQLAlchemy con Flask-Migrate (para migraciones)</div></div><div class="c"><div class="k">Servidor de App (Producción)</div><div class="v">Gunicorn</div></div><div class="c"><div class="k">Almacenamiento (Archivos)</div><div class="v">AWS S3 (para imágenes de reportes y fotos de perfil)</div></div><div class="c"><div class="k">Contenedores</div><div class="v">Docker</div></div><div class="c"><div class="k">Despliegue Continuo</div><div class="v">GitHub Actions</div></div></div>
</div>
</foreignObject>
</svg>
