<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<foreignObject x="0" y="0" width="900" height="420">
<div xmlns="http://www.w3.org/1999/xhtml" class="r">
<style>
*{box-sizing:border-box;margin:0;padding:0}
.r{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;color:#1f2a36;font-size:15px;line-height:1.55;width:100%;height:100%}
b{font-weight:700}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;background:#e3e7e4;border-radius:4px;padding:1px 5px}
.oscuro code{background:#4a5158;color:#f4f5f3}

.hero{height:100%;border-radius:16px;padding:44px 52px;color:#dfe3e1;
 background-color:#343a40;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.3px);background-size:7px 7px}
.t1{font-family:"Arial Black","Segoe UI Black",Arial,sans-serif;font-weight:900;font-size:92px;line-height:.95;letter-spacing:-3px;color:#f4f5f3}
.t2{font-weight:700;font-size:34px;color:#c9ced1;margin-top:6px}
.carril{height:8px;margin:28px 0 26px;background:repeating-linear-gradient(90deg,#f5c518 0 44px,transparent 44px 76px);border-radius:2px}
.hero p{font-size:16px;line-height:1.65;max-width:720px;margin-bottom:12px}
</style>

<div class="hero oscuro">
  <div class="t1">UrbanFix</div>
  <div class="t2">Backend</div>
  <div class="carril"></div>
  <p>Este es el repositorio del servidor backend para UrbanFix, una aplicación móvil diseñada para reportar daños o incidencias en el espacio público de manera rápida y eficiente.</p>
  <p>El objetivo de este backend es gestionar toda la lógica de negocio, autenticación de usuarios/funcionarios, creación de reportes, y el almacenamiento de datos (PostgreSQL) e imágenes (AWS S3). El servidor está construido en Python usando el framework Flask.</p>
</div>
</div>
</foreignObject>
</svg>
