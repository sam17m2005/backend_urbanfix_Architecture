services:
  db:
    image: postgres:16-alpine
    container_name: urbanfixdb
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urbanfix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: urbanfixbackend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/urbanfix
      PORT: 5000
      PYTHONUNBUFFERED: "1"
    depends_on:
      - db

volumes:
  pgdata: